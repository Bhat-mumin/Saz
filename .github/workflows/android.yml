name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build and check
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Prepare APK download
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Saz-debug.apk
          cd apk
          sha256sum Saz-debug.apk > SHA256.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Saz-debug-${{ github.run_number }}
          path: apk/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Saz-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
